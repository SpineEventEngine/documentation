baseURL = 'https://spine.io/'
defaultContentLanguage = 'en'
title = 'Documentation preview'
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.en]
    locale = 'en-US'
    weight = 1

[module]
  # First theme has higher priority than later ones.
  [[module.imports]]
    path = '../..'
  [[module.imports]]
    path = 'github.com/SpineEventEngine/site-commons'

# Remote files that the build fetches, such as `SECURITY.md` for the Security policy page,
# stay cached for an hour. Hugo never expires them by default, so a cache that CI restores
# between runs would keep serving the first copy.
[caches]
  [caches.getresource]
    maxAge = '1h'

# Since v0.162.0, Hugo denies HTML content files by default. The full-screen architecture
# diagram in `docs/content` is one, so HTML is allowed here; Org mode stays denied.
# Hugo ignores `security` in the config of an imported module, so `docs/hugo.toml` can't
# carry this, and each site importing `docs` needs the same setting.
[security]
  allowContent = ['! ^text/org$']

# Enables HTML rendering in markdown files.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    noClasses = false
